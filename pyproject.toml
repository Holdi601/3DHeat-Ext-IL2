[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-il2"
version = "0.2.0"
description = "IL-2 Sturmovik maps (Great Battles; Korea where readable) into .glb levels for the 3DHeat viewer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Holdi601" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
fast = ["numba>=0.58"]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-il2-level = "heat3d_ext_il2.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_il2", "heat3d_update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
